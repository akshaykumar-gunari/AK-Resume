<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshaykumar Gunari</title>
    <link rel="icon" href="AK.jpg">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <iframe 
        src="AK_Resume.pdf#view=FitH&toolbar=0&navpanes=0&scrollbar=0&statusbar=0&messages=0&page=1" 
        frameborder="0"
    ></iframe>

    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            }
        }
        
        document.addEventListener('click', toggleFullScreen);
        window.addEventListener('load', toggleFullScreen);
    </script>
</body>
</html>
